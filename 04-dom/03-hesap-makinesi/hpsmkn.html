<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev 3 - Hesap Makinesi</title>
    <link rel="stylesheet" href="style.css">
    <script src="hpsmkn.js" defer></script>
</head>
<body>
    <div class="kapsayici">
        <h1>🧮 Mini Hesap Makinesi</h1>
        
        <div class="input-alani">
            <input type="number" id="sayi1" placeholder="1. Sayı">
            <input type="number" id="sayi2" placeholder="2. Sayı">
        </div>

        <div class="butonlar">
            <button id="toplaBtn">+</button>
            <button id="cikarBtn">-</button>
            <button id="carpBtn">×</button>
            <button id="bolBtn">÷</button>
        </div>

        <div class="sonuc-alani">
            <h2>Sonuç: <span id="sonuc">0</span></h2>
        </div>
    </div>
</body>
</html>
