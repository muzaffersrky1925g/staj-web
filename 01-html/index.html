<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İlk Sayfam</title>
  </head>
  <body>
    <h1>Merhaba Eria!</h1>
    <p>Benim adım muzaffer. Bu benim ilk web sayfam.</p>

    <p>Şu an <strong>HTML5</strong> ve <em>Git</em> konularını öğreniyorum.</p>

    <h2>Öğrendiğim Teknolojiler</h2>
    <ul>
      <li>HTML5</li>
      <li>CSS3</li>
      <li>Git & GitHub</li>
    </ul>

    <h2>Örnek Görsel</h2>
    <img src="https://via.placeholder.com/150" alt="Örnek Görsel" />

    <h2>Haftalık Çalışma Programı</h2>
    <table border="1">
      <thead>
        <tr>
          <th>Gün</th>
          <th>Konu</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Pazartesi</td>
          <td>HTML Temelleri</td>
        </tr>
        <tr>
          <td>Salı</td>
          <td>Git & GitHub</td>
        </tr>
      </tbody>
    </table>

    <h2>İletişim Formu</h2>
    <form action="" method="POST">
      <div>
        <label for="ad">Ad Soyad:</label>
        <input
          type="text"
          id="ad"
          name="ad"
          placeholder="Adınızı giriniz"
          required
        />
      </div>
      <br />
      <div>
        <label for="eposta">E-posta:</label>
        <input
          type="email"
          id="eposta"
          name="eposta"
          placeholder="ornek@email.com"
          required
        />
      </div>
      <br />
      <div>
        <label for="sifre">Şifre:</label>
        <input type="password" id="sifre" name="sifre" required />
      </div>
      <br />
      <div>
        <input type="submit" value="Gönder" />
      </div>
    </form>
  </body>
</html>
