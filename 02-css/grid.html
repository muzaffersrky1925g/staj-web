<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Mimarisi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>CSS Grid (Izgara) Düzeni</h1>
      <p>İki boyutlu (satır ve sütun) sayfa yerleşimleri oluşturma.</p>
    </header>

    <main>
      <section>
        <h2>Grid Konteyner Örneği</h2>

        <div class="grid-konteyner">
          <div class="grid-oge ogem-1">Üst Alan (Header / Banner)</div>
          <div class="grid-oge ogem-2">Yan Menü (Sidebar)</div>
          <div class="grid-oge ogem-3">Ana İçerik Alanı (Main Content)</div>
          <div class="grid-oge ogem-4">Alt Bilgi (Footer)</div>
        </div>
      </section>
    </main>
  </body>
</html>
