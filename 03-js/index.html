<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Temelleri - Staj</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .bilgi-karti {
        background: #1e293b;
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 450px;
        border: 1px solid #334155;
      }
      h1 {
        color: #38bdf8;
        margin-top: 0;
        font-size: 1.5rem;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
      }
      kbd {
        background: #334155;
        color: #f1f5f9;
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
        font-weight: bold;
        font-family: monospace;
        border-bottom: 2px solid #475569;
      }
    </style>
    <!-- Script dosyanı buraya bağlıyoruz (Hangi JS dosyasındaysan adını ona göre ayarlayabilirsin) -->
    <script src="fonksiyon.js" defer></script>
  </head>
  <body>
    <div class="bilgi-karti">
      <h1>🚀 JavaScript Çalışma Alanı</h1>
      <p>
        Bu sayfadaki kodlar arka planda çalışmaktadır. Sonuçları, hataları ve
        alıştırma çıktılarını görmek için klavyeden <kbd>F12</kbd> tuşuna basın
        ve <strong>Console (Konsol)</strong> sekmesini açın.
      </p>
    </div>
  </body>
</html>
